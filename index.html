    <title>AquíAyuda — Tú puedes ayudar aquí</title>
    <script>
      // Tema aplicado antes del primer pintado para evitar el destello de tema
      // equivocado (FOUC) cuando el usuario ya eligió claro u oscuro.
      (function () {
        try {
          var saved = localStorage.getItem('ac.theme')
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
