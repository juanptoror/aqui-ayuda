<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFF00" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="AquíAyuda centraliza la información de las ayudas tras el terremoto: encuentra el centro de acopio más cercano, mira qué necesita y cómo llegar. Tú puedes ayudar aquí."
    />
    <meta property="og:title" content="AquíAyuda — Tú puedes ayudar aquí" />
    <meta
      property="og:description"
      content="Centros de acopio y ayuda directa, ordenados por cercanía. Disponible para todo Colombia."
    />
    <meta property="og:type" content="website" />
    <!-- Favicon inline: el pin del brand kit, sin una petición de red extra. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 3c-8.284 0-15 6.716-15 15 0 10.5 12.03 24.62 14.03 26.9a1.3 1.3 0 0 0 1.94 0C27.97 42.62 40 28.5 40 18c0-8.284-6.716-15-16-15Z' fill='%23FFFF00'/%3E%3Cpath d='M14.3 24.5 18.4 12h3.1l4.1 12.5h-3.05l-.72-2.4h-3.9l-.72 2.4H14.3Zm3.42-4.65h2.6l-1.3-4.3-1.3 4.3ZM26.4 24.5 30.5 12h3.1l4.1 12.5h-3.05l-.72-2.4h-3.9l-.72 2.4H26.4Zm3.42-4.65h2.6l-1.3-4.3-1.3 4.3Z' fill='%23000'/%3E%3C/svg%3E"
    />
    <title>AquíAyuda — Tú puedes ayudar aquí</title>
    <script>
      // Tema aplicado antes del primer pintado para evitar el destello de tema
      // equivocado (FOUC) cuando el usuario ya eligió claro u oscuro.
      (function () {
        try {
          var saved = localStorage.getItem('ac.theme')
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
